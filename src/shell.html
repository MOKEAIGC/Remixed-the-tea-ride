<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕茶旅 · The Tea Ride</title>
<style>
html,body{margin:0;height:100%;background:#e9d9b6;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}
canvas#c:focus{outline:none}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ecdcba;color:#1d2a44;font:500 13px/1.4 Georgia,"Iowan Old Style",serif;letter-spacing:.06em;transition:opacity .8s;z-index:5}
#ld b{font-size:40px;font-weight:500;letter-spacing:.02em}
#bar{width:200px;height:2px;background:rgba(29,42,68,.14);margin:22px 0 10px;position:relative}#bar s{position:absolute;left:0;top:0;height:2px;width:0;background:#c63a2a}
#st{font:500 10px/1 -apple-system,system-ui,sans-serif;opacity:.55;letter-spacing:.14em;text-transform:uppercase}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font:600 11px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.05em;color:#1d2a44;background:rgba(246,236,212,.82);padding:9px 14px;border-radius:999px;transition:opacity .8s;opacity:0;pointer-events:none;z-index:4;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
#ride-menu,#ride-interface,#ride-film-entry,#ride-film-language,#ride-scene,[data-language-toggle]{font:600 13px/1.3 system-ui,sans-serif;color:#1d2a44;letter-spacing:normal}
#ride-menu{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:25px 20px 0}
.ride-button{border:1px solid #a8987b;border-radius:7px;padding:9px 13px;color:#1d2a44;background:#f8eed9;cursor:pointer;font:inherit}
.ride-button:hover{background:#fff7e6}
.ride-button:focus-visible{outline:2px solid #f8eed9;outline-offset:2px;box-shadow:0 0 0 4px #1d2a44}
.ride-button--primary{background:#a33226;color:#fff7e6;border-color:#8f2a20}
.ride-button--primary:hover{background:#b63b2e}
#ride-menu .ride-button{padding:12px 25px}
#ride-start-language{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px}
[data-language-toggle]{white-space:nowrap}
#ride-interface{position:fixed;inset:0;pointer-events:none;z-index:4}
#ride-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:max(12px,env(safe-area-inset-top)) 14px 0}
#ride-status,#ride-legend{border:1px solid #a8987b;border-radius:8px;background:rgba(248,238,217,.96);box-shadow:0 2px 12px #1625372b}
#ride-status{display:grid;grid-template-columns:auto auto;column-gap:11px;row-gap:3px;padding:8px 12px}
#ride-location{grid-column:1/-1;font-size:14px}
#ride-progress,#ride-speed{color:#565a62;font-size:11px;white-space:nowrap}
#ride-motion{grid-column:1/-1;color:#3f5269;font-size:11px}
#ride-combo{grid-column:1/-1;justify-self:start;pointer-events:auto;display:flex;align-items:center;gap:7px;padding:3px 6px;margin-top:2px;font-size:11px}
#ride-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#ride-actions .ride-button,#ride-film-entry,#ride-film-language{pointer-events:auto;box-shadow:0 2px 12px #1625372b}
#ride-panel-toggle{display:inline-flex;align-items:center;gap:7px;background:#25354d;border-color:#25354d;color:#fff8e8}
#ride-panel-toggle:hover,#ride-panel-toggle[aria-expanded=true]{background:#394d69}
.ride-sliders{width:13px;height:11px;position:relative;border-block:1px solid currentColor;box-sizing:border-box}
.ride-sliders::before{content:"";position:absolute;left:0;right:0;top:4px;border-top:1px solid currentColor}
.ride-sliders::after{content:"";position:absolute;left:2px;top:-2px;width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:6px 5px currentColor,2px 10px currentColor}
#ride-film-entry{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:4}
#ride-film-language{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 43px);right:14px;z-index:4}
#ride-legend{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;justify-content:center;flex-wrap:wrap;gap:6px 13px;width:max-content;max-width:calc(100vw - 42px);padding:8px 12px;font-size:11px}
#ride-legend span{white-space:nowrap}
#ride-legend kbd{font:inherit;font-weight:800;margin-right:5px}
#ride-interface:has(#ride-panel:not([hidden])) #ride-legend{display:none}
body.ride-active #hud{bottom:66px}
.ride-glass{
  background:#f6efdf;border:1px solid #e3d4bb;border-radius:16px;
  box-shadow:0 18px 60px #18223745,0 1px 0 #fff9ed inset;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .ride-glass{background:rgba(249,242,226,.81);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4)}
}
#ride-panel{
  position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 48px);right:14px;
  width:min(446px,calc(100vw - 28px));max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px);
  box-sizing:border-box;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;
  pointer-events:auto;z-index:2;
}
.ride-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 11px}
.ride-panel-head h2,#ride-scene h2{font-size:17px;line-height:1.25;margin:0;font-weight:760}
#ride-view-info{margin:3px 0 0;font-size:11px;color:#495b70}
#ride-panel-close{width:33px;height:33px;padding:0;font-size:20px;color:#33465e}
.ride-panel-options{display:flex;gap:6px;padding:0 18px 11px;border-bottom:1px solid #71553826}
.ride-panel-options button{flex:1;border-color:transparent;background:#fff8ea8c}
.ride-panel-options button:hover{background:#fffbf2}
.ride-panel-options button[aria-pressed=true]{background:#27384f;border-color:#27384f;color:#fff7e6}
#ride-panel-body{min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 18px 18px;scrollbar-color:#798499 transparent}
.ride-command-group+.ride-command-group{margin-top:15px}
.ride-command-group h3,.ride-scene-group h3{margin:0 0 6px;font-size:12px;font-weight:760;color:#3f5168}
.ride-command-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
#ride-scene-list{display:grid;gap:15px}
.ride-scene-group{display:grid;gap:6px}
.ride-scene-group h3{margin-bottom:0}
.ride-command{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:4px 7px;min-height:41px;
  width:100%;padding:8px 9px;text-align:left;border-color:#95847068;background:#fff9eeaf;
}
.ride-command:hover{background:#fffaf0;border-color:#a69273}
.ride-command[data-held]{color:#fff7e6;background:#27384f;border-color:#27384f}
.ride-command-title{align-self:center}
.ride-command-detail{grid-column:1/-1;color:#4a5868;font-size:11px;font-weight:500}
.ride-command[data-held] .ride-command-detail{color:#e3e9f2}
.ride-key{
  display:inline-grid;place-items:center;min-width:14px;min-height:14px;align-self:center;
  padding:1px 4px;border:1px solid currentColor;border-radius:4px;font:700 10px/1.1 system-ui,sans-serif;
  white-space:nowrap;opacity:.86;
}
.ride-command .ride-key{color:#53637a;opacity:1;border-color:#53637a5c}
.ride-command[data-held] .ride-key{color:#fff7e6;border-color:#fff7e68c}
#ride-panel [data-ride-hold]{touch-action:none;user-select:none}
#ride-scene{
  position:fixed;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  box-sizing:border-box;width:min(465px,calc(100vw - 28px));padding:13px 15px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;
}
#ride-scene p{margin:3px 0 0;color:#495b70;font-size:11px}
#ride-scene #ride-scene-cue{color:#263a56;font-weight:700}
#ride-scene-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:5px}
#ride-scene progress{grid-column:1/-1;width:100%;height:5px;accent-color:#a33226}
#ride-touch{display:none;position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:14px;right:14px;align-items:flex-end;justify-content:space-between;gap:12px}
#ride-touch .ride-button{min-width:46px;min-height:46px;padding:7px 9px;pointer-events:auto;touch-action:none;user-select:none;box-shadow:0 2px 8px #16253745}
#ride-touch .ride-button[data-held]{background:#1d2a44;color:#fff7e6;border-color:#1d2a44}
#ride-directions{display:grid;grid-template-areas:'. up .' 'left down right';gap:5px;font-size:18px}
#ride-directions [data-ride-hold=forward]{grid-area:up}
#ride-directions [data-ride-hold=left]{grid-area:left}
#ride-directions [data-ride-hold=back]{grid-area:down}
#ride-directions [data-ride-hold=right]{grid-area:right}
#ride-touch-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
@media (pointer:coarse){
  #ride-touch{display:flex}
  #ride-legend{display:none}
  #ride-panel{max-height:calc(100vh - 175px);max-height:calc(100dvh - 175px)}
  body.ride-active #hud{bottom:122px}
}
@media(max-width:460px){
  #ride-top{margin-inline:9px}
  #ride-top .ride-button{padding:8px 7px;font-size:12px}
  #ride-top #ride-reset-button{display:none}
  #ride-status{column-gap:7px;padding:7px 8px}
  #ride-location{font-size:12px}
  #ride-scene-actions .ride-button{padding:7px 8px;font-size:11px}
  .ride-panel-head,.ride-panel-options,#ride-panel-body{padding-inline:12px}
  #ride-touch{left:9px;right:9px;gap:7px}
  #ride-touch .ride-button{min-width:42px;padding-inline:6px}
}
@media(max-width:325px){
  #ride-touch-actions .ride-button{min-width:36px;padding-inline:4px;font-size:11px}
}
</style></head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="ld">
  <button id="ride-start-language" type="button" class="ride-button" data-language-toggle="long" lang="en" title="Switch to English" aria-label="Switch to English">English</button>
  <b data-en-text="The Tea Ride">鹈鹕茶旅</b>
  <div id="bar"><s></s></div>
  <div id="st">准备木版画</div>
  <div id="ride-menu" role="group" aria-label="选择模式" data-en-label="Choose a mode" hidden>
    <button type="button" class="ride-button ride-button--primary" data-ride-mode="ride" data-en-text="Free Ride">自由骑行</button>
    <button type="button" class="ride-button" data-ride-mode="film" data-en-text="Watch Film">播放短片</button>
    <button type="button" class="ride-button" data-ride-mode="demo" data-en-text="Gameplay Demo">游玩演示</button>
  </div>
</div>
<div id="hud"></div>
<button id="ride-film-entry" type="button" class="ride-button" data-ride-mode="ride" data-en-text="Free Ride" hidden>自由骑行</button>
<button id="ride-film-language" type="button" class="ride-button" data-language-toggle lang="en" title="Switch to English" aria-label="Switch to English" hidden>EN</button>
<div id="ride-interface" hidden>
  <div id="ride-top">
    <div id="ride-status">
      <span id="ride-location"></span>
      <span id="ride-progress" aria-live="polite"></span>
      <span id="ride-speed"></span>
      <span id="ride-motion" hidden></span>
      <button id="ride-combo" type="button" class="ride-button" data-ride-action="cancelCombo" title="结束组合 (Esc)" data-en-title="Cancel combo (Esc)" hidden><span id="ride-combo-label"></span><span aria-hidden="true">×</span></button>
    </div>
    <div id="ride-actions">
      <button id="ride-reset-button" type="button" class="ride-button" data-ride-action="reset" title="返回起点 (R)" data-en-title="Return to the start (R)" data-en-text="Reset">返回起点</button>
      <button type="button" class="ride-button" data-ride-mode="film" data-en-text="Watch Film">播放短片</button>
      <button id="ride-panel-toggle" type="button" class="ride-button" aria-expanded="false" aria-controls="ride-panel" aria-keyshortcuts="H">
        <span class="ride-sliders" aria-hidden="true"></span><span data-en-text="Controls">控制台</span><kbd class="ride-key" aria-hidden="true">H</kbd>
      </button>
      <button type="button" class="ride-button" data-language-toggle lang="en" title="Switch to English" aria-label="Switch to English">EN</button>
    </div>
  </div>
  <div id="ride-legend" aria-label="键盘和鼠标操作" data-en-label="Keyboard and mouse controls">
    <span><kbd data-en-text="WASD / Arrows">WASD / 方向键</kbd><span data-en-text="Move">移动</span></span>
    <span><kbd>Shift</kbd><span data-en-text="Boost">加速</span></span>
    <span><kbd data-en-text="Space">空格</kbd><span data-en-text="Take off">起飞</span></span>
    <span><kbd>C</kbd><span data-en-text="Land">降落</span></span>
    <span><kbd>Z / X</kbd><span data-en-text="Climb / descend">升降</span></span>
    <span><kbd>H</kbd><span data-en-text="Controls">控制台</span></span>
  </div>
  <div id="ride-touch" role="group" aria-label="触控骑行" data-en-label="Touch controls">
    <div id="ride-directions">
      <button type="button" class="ride-button" data-ride-hold="forward" aria-label="前进" data-en-label="Move forward">↑</button>
      <button type="button" class="ride-button" data-ride-hold="left" aria-label="左转" data-en-label="Turn left">←</button>
      <button type="button" class="ride-button" data-ride-hold="back" aria-label="后退" data-en-label="Move backward">↓</button>
      <button type="button" class="ride-button" data-ride-hold="right" aria-label="右转" data-en-label="Turn right">→</button>
    </div>
    <div id="ride-touch-actions">
      <button type="button" class="ride-button" data-ride-hold="sprint" data-en-text="Boost">加速</button>
      <button type="button" class="ride-button" data-ride-hold="ascend" data-en-text="Climb">上升</button>
      <button type="button" class="ride-button" data-ride-hold="descend" data-en-text="Descend">下降</button>
      <button type="button" class="ride-button" data-ride-action="takeoff" data-en-text="Take off">起飞</button>
      <button type="button" class="ride-button" data-ride-action="land" data-en-text="Land">降落</button>
      <button type="button" class="ride-button" data-ride-action="sip" data-en-text="Sip tea">喝茶</button>
    </div>
  </div>
  <section id="ride-panel" class="ride-glass" aria-labelledby="ride-panel-title" tabindex="-1" hidden>
    <header class="ride-panel-head">
      <div><h2 id="ride-panel-title" data-en-text="Ride Controls">骑行控制台</h2><p id="ride-view-info" hidden></p></div>
      <button id="ride-panel-close" type="button" class="ride-button" title="收起控制台 (Esc)" data-en-title="Close controls (Esc)" aria-label="收起控制台" data-en-label="Close controls" aria-keyshortcuts="Escape">×</button>
    </header>
    <div class="ride-panel-options" role="group" aria-label="控制台内容" data-en-label="Control categories">
      <button id="ride-show-actions" type="button" class="ride-button" aria-controls="ride-command-list" aria-pressed="true" data-en-text="Actions & View">动作与视角</button>
      <button id="ride-show-scenes" type="button" class="ride-button" aria-controls="ride-scene-list" aria-pressed="false" data-en-text="Film Scenes">位点演出</button>
    </div>
    <div id="ride-panel-body">
      <div id="ride-command-list"></div>
      <div id="ride-scene-list" hidden></div>
    </div>
  </section>
</div>
<section id="ride-scene" class="ride-glass" aria-labelledby="ride-scene-title" hidden>
  <div><h2 id="ride-scene-title">位点演出</h2><p id="ride-scene-detail" hidden></p><p id="ride-scene-cue" hidden></p></div>
  <div id="ride-scene-actions">
    <button type="button" class="ride-button" data-language-toggle lang="en" title="Switch to English" aria-label="Switch to English">EN</button>
    <button type="button" class="ride-button" data-ride-action="stopScene" aria-keyshortcuts="Escape"><span id="ride-scene-exit">返回骑行</span> <kbd class="ride-key" aria-hidden="true">Esc</kbd></button>
  </div>
  <progress id="ride-scene-progress" max="1" aria-label="演出进度" data-en-label="Scene progress" hidden></progress>
</section>
<script>{{THREE}}</script>
<script>
{{APP}}
</script></body></html>
